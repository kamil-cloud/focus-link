<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f6f9; --text: #17171c; --muted: #55556a; --accent: #4f46e5; --card: #fff; --border: #e2e2ea; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f0f14; --text: #f1f1f5; --muted: #a9a9bb; --accent: #8b84ff; --card: #18181f; --border: #2e2e39; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
    main { width: min(440px, 100%); padding: 28px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); text-align: center; }
    .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.1rem; margin-bottom: 14px; }
    .mark { width: 18px; height: 18px; border-radius: 50%; border: 4px solid var(--accent); }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 16px; }
    button { min-height: 44px; padding: 8px 18px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true"></span>Focus</div>
    <h1 id="title">Opening Focus…</h1>
    <p id="text" role="status">Finding your teacher's Focus server.</p>
    <button id="retry" type="button" hidden>Try again</button>
  </main>
  <script>
    'use strict';
    // Lien permanent : trouve l'adresse actuelle du serveur Focus, puis y redirige.
    (() => {
      const params = new URLSearchParams(location.search);
      const code = params.get('join');
      const $ = (id) => document.getElementById(id);

      async function getJson(url, headers = {}) {
        const res = await fetch(url, { headers, cache: 'no-store' });
        if (!res.ok) throw new Error(String(res.status));
        return res.json();
      }

      async function findServer() {
        const directory = await getJson(`directory.json?t=${Date.now()}`);
        for (const source of directory.server || []) {
          try {
            const headers = source.includes('api.github.com') ? { Accept: 'application/vnd.github.raw+json' } : {};
            const info = await getJson(`${source}?t=${Date.now()}`, headers);
            if (!info.url) continue;
            const health = await getJson(`${info.url}/api/health`);
            if (health.ok) return info.url;
          } catch {
            // Source suivante (adresse en cache périmée, limite d'appels…).
          }
        }
        return null;
      }

      async function go() {
        $('retry').hidden = true;
        $('title').textContent = 'Opening Focus…';
        $('text').textContent = "Finding your teacher's Focus server.";
        let url = null;
        try {
          url = await findServer();
        } catch {
          url = null;
        }
        if (!url) {
          $('title').textContent = 'The Focus server is offline';
          $('text').textContent = 'Your teacher needs to start Focus. Try again in a moment.';
          $('retry').hidden = false;
          $('retry').focus();
          return;
        }
        location.replace(code ? `${url}/j/${encodeURIComponent(code)}` : `${url}/login`);
      }

      $('retry').addEventListener('click', go);
      go();
    })();
  </script>
</body>
</html>
